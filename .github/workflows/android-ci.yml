name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: SproutLauncher

      - name: Remove local.properties (CI)
        run: rm -f SproutLauncher/local.properties

      - name: Make Gradle wrapper executable (Linux)
        working-directory: SproutLauncher
        run: chmod +x ./gradlew

      - name: Build with Gradle
        working-directory: SproutLauncher
        run: ./gradlew build --stacktrace --no-daemon
